[project]
name = "ai-consulting-accelerator"
version = "0.1.0"
description = "AI Consulting Accelerator — Framework Q&A and BA/RE/PM artifact structuring"
requires-python = ">=3.12"

dependencies = [
    # The entire heavy stack (loaders, chunker, embedder, vector store, ORM models,
    # settings, LLM providers) is reused from the neighbouring platform package.
    # Transitive deps (sqlalchemy, asyncpg, pgvector, pdfplumber, openai, tiktoken,
    # langchain-text-splitters, fastapi, mangum, ...) come in via aiplatform.
    # Distribution name is "ai-platform"; the import package is "aiplatform".
    "ai-platform",
]

# Editable install of the sibling platform repo — changes there take effect
# immediately without re-installing. Path is relative to this pyproject.toml.
[tool.uv.sources]
ai-platform = { path = "../ai-platform-project-v1", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "scripts"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "B008",  # Depends() in default args is the correct FastAPI DI pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
